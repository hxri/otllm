[project]
name = "otllm"
version = "0.1.0"
description = "Research framework for studying overthinking and rumination in LLMs"
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.27",
    "sentence-transformers>=3.0",
    "typer[all]>=0.12",
    "vaderSentiment>=3.3",
    "jinja2>=3.1",
    "numpy>=1.24",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
otllm = "otllm.cli.main:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
